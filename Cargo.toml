[package]
name = "claude-code-monitor"
version = "0.1.0"
edition = "2021"
description = "Real-time terminal dashboard for monitoring Claude Code usage"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "5.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
